<header>Parallel Query is Silently Stealing Your CPU</header>
<h2 id="refresher-how-postgres-goes-parallel">Refresher: how Postgres goes parallel</h2>
<ul>
<li>Planner sees a query that <em>might</em> benefit from parallelism</li>
<li>Estimates cost with <code>parallel_setup_cost</code> + <code>parallel_tuple_cost</code></li>
<li>If parallel plan wins, executor spawns <strong>N background workers*</strong></li>
<li>Workers feed tuples back to the leader via shared memory</li>
<li>Leader merges, returns result</li>
</ul>
<p>Sounds great. What could go wrong?</p>
<div style="position:absolute;bottom:24px;right:56px;font-size:1em;color:#888888">* leader is also a worker</div>

<header>Parallel Query is Silently Stealing Your CPU</header>
<h2 id="the-win-that-isnt">The win that isn't</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql">EXPLAIN (ANALYZE, BUFFERS)
<span class="hljs-keyword">SELECT</span> event_type, <span class="hljs-built_in">count</span>(<span class="hljs-operator">*</span>)
<span class="hljs-keyword">FROM</span> events
<span class="hljs-keyword">WHERE</span> created_at <span class="hljs-operator">&gt;=</span> now() <span class="hljs-operator">-</span> <span class="hljs-type">interval</span> <span class="hljs-string">&#x27;180 days&#x27;</span>
<span class="hljs-keyword">GROUP</span> <span class="hljs-keyword">BY</span> event_type;
</code></pre>
<table>
<thead>
<tr>
<th>Metric</th>
<th>Serial</th>
<th>Parallel (2 workers)</th>
</tr>
</thead>
<tbody>
<tr>
<td>Wall-clock time</td>
<td>3 min</td>
<td><strong>1 min</strong> <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></td>
</tr>
<tr>
<td>Total CPU time</td>
<td>3 min</td>
<td><strong>~3 min</strong> ➡</td>
</tr>
<tr>
<td>Buffer reads</td>
<td>6.4M</td>
<td>6.4M</td>
</tr>
</tbody>
</table>
<p>Wall-clock dropped. <strong>CPU per query is the same.</strong><br />
But you're now running 3 processes instead of 1.</p>

<header>Parallel Query is Silently Stealing Your CPU</header>
<h2 id="why-this-matters-in-production">Why this matters in production</h2>
<ul>
<li>Your dashboard latency: down 3×. Looks great.</li>
<li>Now run <strong>200 concurrent connections</strong> doing the same thing.</li>
<li>Serial: <strong>200 processes</strong> competing for CPU simultaneously.</li>
<li>Parallel: <strong>600 processes</strong> competing for CPU simultaneously.</li>
<li>Same total CPU. Triple the concurrency. Triple the context switching.</li>
<li>You don't have 600 processes worth of headroom. Welcome to your context-switch nightmare.</li>
</ul>
<blockquote>
<p>Parallelism is a tradeoff between <em>latency</em> and <em>throughput</em>.<br />
The default behavior assumes you only care about latency.</p>
</blockquote>
<footer>Scott Mead · Postgres Conference San Jose 2026</footer>

<header>Parallel Query is Silently Stealing Your CPU</header>
<h2 id="every-connection-is-a-process">Every connection is a process</h2>
<p>Postgres does not use threads. Every client connection is a <code>fork()</code>:</p>
<ul>
<li>New OS process spawned</li>
<li>Memory allocated and initialized</li>
<li>Shared memory attached</li>
<li>Authentication handshake completed</li>
<li>Session state established</li>
</ul>
<p><strong>All of this before a single row is touched.</strong></p>
<p>On a well-tuned system with a connection pool, this cost is paid once<br />
and amortized. Without one, it's paid on every request.</p>
<footer>Scott Mead · Postgres Conference San Jose 2026</footer>

<header>Parallel Query is Silently Stealing Your CPU</header>
<h2 id="every-parallel-query-pays-again">Every parallel query pays again</h2>
<p>On top of the client connection cost, every parallel query launches<br />
background workers — each one its own <code>fork()</code>:</p>
<ul>
<li>New OS process spawned</li>
<li>Dynamic shared memory segment created</li>
<li>IPC message queues initialized</li>
<li>Worker registered with postmaster</li>
<li>Worker connects to DSM and begins execution</li>
</ul>
<p><code>parallel_setup_cost = 1000</code> is the planner's <em>model</em> of this cost.<br />
The actual CPU burn is real and paid at execution time regardless.</p>
<footer>Scott Mead · Postgres Conference San Jose 2026</footer>

<header>Parallel Query is Silently Stealing Your CPU</header>
<h2 id="your-connection-pooler-cant-fix-this">Your connection pooler can't fix this</h2>
<p>PgBouncer, pgpool, RDS Proxy — they all operate at the <strong>client connection</strong> level.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Client → [PgBouncer] → Backend process
                            ↓
                       parallel worker 1  ← fork()
                       parallel worker 2  ← fork()
</code></pre>
<p>The pooler eliminated the client <code>fork()</code>.<br />
It has no visibility into — and no control over —<br />
the workers spawned inside the backend.</p>
<p><strong>Two separate taxes. The pooler only waives one.</strong></p>
<footer>Scott Mead · Postgres Conference San Jose 2026</footer>

<header>Parallel Query is Silently Stealing Your CPU</header>
<h2 id="the-compounding-problem">The compounding problem</h2>
<p>A query with <strong>5ms execution time</strong> on a large table might spend:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>client connection setup:     ~2ms
parallel worker launch (×2):  ~3ms
                             ------
actual query execution:        5ms
                             ------
total wall-clock:             10ms   ← not 5ms
</code></pre>
<p>Half the wall-clock time is setup, not work.</p>
<p>Now multiply by 500 concurrent requests.<br />
Workers launching, forking, tearing down — constantly.<br />
Your CPU is busy before any data moves.</p>
<footer>Scott Mead · Postgres Conference San Jose 2026</footer>
</section>

<header>Parallel Query is Silently Stealing Your CPU</header>
<h2 id="detection">Detection</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-comment">-- Connection churn — new connections being created constantly?</span>
<span class="hljs-keyword">SELECT</span> <span class="hljs-built_in">count</span>(<span class="hljs-operator">*</span>), state, backend_start::<span class="hljs-type">date</span>
<span class="hljs-keyword">FROM</span> pg_stat_activity
<span class="hljs-keyword">GROUP</span> <span class="hljs-keyword">BY</span> state, backend_start::<span class="hljs-type">date</span>
<span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> backend_start::<span class="hljs-type">date</span> <span class="hljs-keyword">DESC</span>;

<span class="hljs-comment">-- Worker overhead — how many workers active right now?</span>
<span class="hljs-keyword">SELECT</span> <span class="hljs-built_in">count</span>(<span class="hljs-operator">*</span>) <span class="hljs-keyword">FILTER</span> (<span class="hljs-keyword">WHERE</span> backend_type <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;parallel worker&#x27;</span>) <span class="hljs-keyword">AS</span> workers,
       <span class="hljs-built_in">count</span>(<span class="hljs-operator">*</span>) <span class="hljs-keyword">FILTER</span> (<span class="hljs-keyword">WHERE</span> backend_type <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;client backend&#x27;</span>)  <span class="hljs-keyword">AS</span> clients
<span class="hljs-keyword">FROM</span> pg_stat_activity;
</code></pre>
<p>If <code>workers</code> is a significant fraction of <code>clients</code>, you're paying<br />
the parallel setup tax on most of your queries.</p>
<footer>Scott Mead · Postgres Conference San Jose 2026</footer>

<header>Parallel Query is Silently Stealing Your CPU</header>
<h2 id="the-setup">The setup</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> <span class="hljs-operator">*</span> <span class="hljs-keyword">FROM</span> events <span class="hljs-keyword">WHERE</span> customer_id <span class="hljs-operator">=</span> <span class="hljs-number">42</span>;
</code></pre>
<p>100K customers. Events table grows over time.<br />
Each customer accumulates events at roughly the same rate.</p>
<p>At <strong>any normal event count per customer</strong>, the planner<br />
correctly chooses an index scan. Fast. Predictable.</p>
<p>Until it isn't.</p>
<footer>Scott Mead · Postgres Conference San Jose 2026</footer>

<header>Parallel Query is Silently Stealing Your CPU</header>
<h2 id="the-crossover">The crossover</h2>
<p>On a <strong>50GB events table</strong> (250M rows), at <strong>547,000 events</strong> for a single customer:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Index Scan cost       = 547,000 × 4.0
                      = 2,188,000

Parallel Seq Scan cost = 1,000
                       + (6,400,000 / 3)
                       + (0.1 × 547,000)
                       = 1,000 + 2,133,333 + 54,700
                       = 2,189,033
</code></pre>
<p><strong>Dead even.</strong> One more event tips the balance.<br />
Below <strong>~547K events</strong>: index scan <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/><br />
Above <strong>~547K events</strong>: parallel seq scan</p>
<div style="position:absolute;bottom:24px;right:56px;font-size:1em;color:#888888">* serial seq scan at this table size: 6,400,000 — never competitive</div>
<footer>Scott Mead · Postgres Conference San Jose 2026</footer>

<header>Parallel Query is Silently Stealing Your CPU</header>
<h2 id="index-cost-the-full-picture">Index cost: the full picture</h2>
<p>The crossover slide uses <code>matching_rows × random_page_cost</code> — a reasonable<br />
approximation for a low-correlation index. The planner's actual formula:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Index Scan cost
  = (index pages × random_page_cost)          -- B-tree traversal
  + (heap pages × effective_page_cost)         -- correlation-adjusted
  + (rows × cpu_index_tuple_cost)              -- 0.005 default
  + (rows × cpu_tuple_cost)                    -- 0.01  default
</code></pre>
<p><strong>Correlation</strong> is the key variable. If <code>customer_id</code> rows are inserted in<br />
order (e.g. monotonically increasing IDs), heap pages may be nearly sequential<br />
— effective cost approaches <code>seq_page_cost</code>. If events are scattered across<br />
the heap, it approaches <code>random_page_cost</code>.</p>
<footer>Scott Mead · Postgres Conference San Jose 2026</footer>

<header>Parallel Query is Silently Stealing Your CPU</header>
<h2 id="index-cost-correlation-matters">Index cost: correlation matters</h2>
<p>At 547K rows, <strong>full correlation</strong> (best case for index scan):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>heap pages fetched  ≈ 547,000 × 1.0   =   547,000   (sequential-like)
index pages         ≈ 1,500   × 4.0   =     6,000
cpu costs           ≈ 547,000 × 0.015 =     8,205
                                       ----------
Total (correlated)                     ≈   561,205   ← index wins easily
</code></pre>
<p>At 547K rows, <strong>zero correlation</strong> (worst case — events scattered across heap):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>heap pages fetched  ≈ 547,000 × 4.0   = 2,188,000   (fully random)
index pages         ≈ 1,500   × 4.0   =     6,000
cpu costs           ≈ 547,000 × 0.015 =     8,205
                                       ----------
Total (uncorrelated)                   ≈ 2,202,205   ← dead even with parallel
</code></pre>
<p>For an events table with scattered inserts per customer, correlation is low.<br />
The approximation holds. On a perfectly ordered table, the crossover<br />
threshold would be much higher — or might never be reached.</p>
<footer>Scott Mead · Postgres Conference San Jose 2026</footer>

</ul>

<h2 id="the-plan-before-and-after">The plan before and after</h2>
<p><strong>Under 547K events — Index Scan:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Index Scan on events  (cost=0.00..10,000 rows=500,000)
  Index Cond: (customer_id = 42)
</code></pre>
<p><strong>Over 547K events — silent flip:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Gather  (cost=1000.00..2134583.00 rows=547000)
  Workers Planned: 2
  Workers Launched: 2
  -&gt;  Parallel Seq Scan on events
        Filter: (customer_id = 42)
</code></pre>
<p>Same query. Same index. Different plan.<br />

Nobody changed anything.</p>

<header>Parallel Query is Silently Stealing Your CPU</header>
<h2 id="what-your-customer-experiences">What your customer experiences</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Browser                 App Server            Postgres
  |                         |                    |
  |--- GET /dashboard ----→ |                    |
  |                         |--- SELECT events --→|
  |                         |                    | [fork worker 1]
  |                         |                    | [fork worker 2]
  |                         |                    |   ... scanning ...
  |                         |                    |   ... scanning ...
  |      (~13 seconds)      |                    |   ... scanning ...
  |                         |                    |   ... scanning ...
  |                         |                    | [workers return]
  |                         |←-- 547K rows ------||
  |←-- page renders ------  |                    |
</code></pre>
<p>Your most active customer hits their dashboard.<br />
The page spinner runs for <strong>13 seconds</strong>.<br />
Index scan was milliseconds. Nothing changed except event count.</p>
<p>They didn't do anything wrong.<br />
You didn't deploy anything.<br />
The database is working exactly as designed.</p>

<header>Parallel Query is Silently Stealing Your CPU</header>
<h2 id="the-math-nobody-does">The math nobody does</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>max_parallel_workers_per_gather = 2   -- default
max_parallel_workers            = 8   -- default
</code></pre>
<ul>
<li>1 query → 2 workers <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></li>
<li>2 queries → 4 workers <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></li>
<li>3 queries → 6 workers <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></li>
<li>4 queries → 8 workers <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></li>
<li><strong>5th query</strong> → <strong>0 workers launched</strong></li>
</ul>
<p>The 5th query already paid <code>parallel_setup_cost</code> in planning.<br />
And now... it doesn't fall back to serial. It does something worse.</p>

<header>Parallel Query is Silently Stealing Your CPU</header>
<h2 id="it-does-not-fall-back-to-serial">It does NOT fall back to serial</h2>
<p>When workers can't launch, Postgres does <strong>not</strong> re-plan.</p>
<p>The leader executes <strong>the same parallel plan</strong> — alone, in one process.</p>
<blockquote>
<p>&quot;the leader will execute the portion of the plan below the<br />
Gather node entirely by itself, almost as if the Gather node<br />
were not present.&quot;<br />
— PostgreSQL docs, §15.2</p>
</blockquote>
<footer>Scott Mead · Postgres Conference San Jose 2026</footer>

<header>Parallel Query is Silently Stealing Your CPU</header>
<h2 id="why-this-is-worse-than-just-serial">Why this is worse than &quot;just serial&quot;</h2>
<p>The planner picked Parallel Seq Scan <strong>because</strong> it assumed 4 workers.</p>
<p>That math beat the Index Scan it would have picked otherwise.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Workers Planned: 4
Workers Launched: 0      ← the smoking gun
-&gt;  Parallel Seq Scan on events  (250M rows, single-threaded)
</code></pre>
<p>You're not running a serial plan.<br />
You're running <strong>a parallel plan, serially</strong>, on a single core,<br />
that was only chosen because parallelism was assumed.</p>
<p>It's worse than disabling parallelism entirely.</p>
<footer>Scott Mead · Postgres Conference San Jose 2026</footer>
</section>

<header>Parallel Query is Silently Stealing Your CPU</header>
<h2 id="the-problem-with-explain">The problem with EXPLAIN</h2>
<p><code>EXPLAIN ANALYZE</code> shows <code>Workers Planned: 2, Workers Launched: 0</code> —<br />
but only <strong>if you run it while the system is under load</strong>.</p>
<p>Run it on an idle box and workers launch just fine.<br />
The problem disappears. You find nothing.</p>
<p>This is not a debugging tool for worker exhaustion.<br />
You need <strong>cumulative counters</strong>, not point-in-time plans.</p>
<footer>Scott Mead · Postgres Conference San Jose 2026</footer>

<h2 id="pg_stat_database--pg_stat_statements-pg-18">pg_stat_database + pg_stat_statements (PG 18+)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-comment">-- Cluster-level: is the pool being starved?</span>
<span class="hljs-keyword">SELECT</span> datname,
       parallel_workers_to_launch,
       parallel_workers_launched,
       parallel_workers_to_launch
         <span class="hljs-operator">-</span> parallel_workers_launched <span class="hljs-keyword">AS</span> gap
<span class="hljs-keyword">FROM</span> pg_stat_database
<span class="hljs-keyword">WHERE</span> datname <span class="hljs-operator">=</span> current_database();

<span class="hljs-comment">-- Query-level: which queries are losing workers?</span>
<span class="hljs-keyword">SELECT</span> query,
       parallel_workers_to_launch,
       parallel_workers_launched,

         <span class="hljs-operator">-</span> parallel_workers_launched <span class="hljs-keyword">AS</span> gap
<span class="hljs-keyword">FROM</span> pg_stat_statements
<span class="hljs-keyword">WHERE</span> parallel_workers_to_launch <span class="hljs-operator">&gt;</span> <span class="hljs-number">0</span>
<span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> gap <span class="hljs-keyword">DESC</span>
LIMIT <span class="hljs-number">10</span>;
</code></pre>

<header>Parallel Query is Silently Stealing Your CPU</header>
<h2 id="a-multiplier-you-didnt-ask-for">A multiplier you didn't ask for</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE TABLE</span> events_part (...) <span class="hljs-keyword">PARTITION</span> <span class="hljs-keyword">BY</span> <span class="hljs-keyword">RANGE</span> (created_at);
<span class="hljs-comment">-- 12 monthly partitions, growing every month</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> event_type, <span class="hljs-built_in">count</span>(<span class="hljs-operator">*</span>) <span class="hljs-keyword">FROM</span> events_part <span class="hljs-keyword">GROUP</span> <span class="hljs-keyword">BY</span> event_type;
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Finalize GroupAggregate
  -&gt; Gather (workers planned: 2)
    -&gt; Parallel Append
      -&gt; Parallel Seq Scan on events_p202504
      -&gt; Parallel Seq Scan on events_p202505
      ... 12 partitions ...
</code></pre>
<p>2 workers shared across 12 partitions — not 2 per partition.<br />
But the number of workers <em>requested</em> scales with partition count.</p>

<p>That number is capped by <code>max_parallel_workers_per_gather</code> — but as partitions grow, the planner keeps asking for more. Nobody noticed the partition count doubled. Nobody re-audited the plan. The query just got slower and hungrier.</p>
<blockquote>
<p>Parallel features compound. Audit them when your data shape changes.</p>
</blockquote>
<div style="position:absolute;bottom:24px;right:56px;font-size:0.6em;color:#888888">* Postgres also factors in partition size via compute_parallel_worker()</div>

<header>Parallel Query is Silently Stealing Your CPU</header>
<h2 id="find-the-suspects">Find the suspects</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-comment">-- Live: are workers being starved right now?</span>
<span class="hljs-keyword">SELECT</span> <span class="hljs-built_in">count</span>(<span class="hljs-operator">*</span>) <span class="hljs-keyword">FILTER</span> (<span class="hljs-keyword">WHERE</span> backend_type <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;parallel worker&#x27;</span>) <span class="hljs-keyword">AS</span> workers,
       <span class="hljs-built_in">count</span>(<span class="hljs-operator">*</span>) <span class="hljs-keyword">FILTER</span> (<span class="hljs-keyword">WHERE</span> state <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;active&#x27;</span>)                 <span class="hljs-keyword">AS</span> active_clients
<span class="hljs-keyword">FROM</span> pg_stat_activity;

<span class="hljs-comment">-- Live: who is waiting on parallel infrastructure?</span>
<span class="hljs-keyword">SELECT</span> pid, wait_event_type, wait_event, query
<span class="hljs-keyword">FROM</span> pg_stat_activity
<span class="hljs-keyword">WHERE</span> wait_event <span class="hljs-keyword">IN</span> (<span class="hljs-string">&#x27;BgWorkerShutdown&#x27;</span>, <span class="hljs-string">&#x27;BgWorkerStartup&#x27;</span>, <span class="hljs-string">&#x27;ExecuteGather&#x27;</span>, <span class="hljs-string">&#x27;ParallelFinish&#x27;</span>);
</code></pre>
<p>If <code>workers</code> is regularly at <code>max_parallel_workers</code>, you have a problem.<br />
Sessions on <code>ExecuteGather</code> are blocked waiting for parallel results.<br />
Sessions on <code>ParallelFinish</code> are waiting for workers to finish and clean up.<br />
Sessions on <code>BgWorkerStartup</code> / <code>BgWorkerShutdown</code> are in worker lifecycle overhead.</p>

<header>Parallel Query is Silently Stealing Your CPU</header>
<h2 id="find-the-suspects-pg-18">Find the suspects (PG 18+)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-comment">-- Cumulative: which queries are losing workers?</span>
<span class="hljs-keyword">SELECT</span> query,
       parallel_workers_to_launch,
       parallel_workers_launched,
       parallel_workers_to_launch
         <span class="hljs-operator">-</span> parallel_workers_launched <span class="hljs-keyword">AS</span> gap
<span class="hljs-keyword">FROM</span> pg_stat_statements
<span class="hljs-keyword">WHERE</span> parallel_workers_to_launch <span class="hljs-operator">&gt;</span> <span class="hljs-number">0</span>
<span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> gap <span class="hljs-keyword">DESC</span>
LIMIT <span class="hljs-number">10</span>;

<span class="hljs-comment">-- Cumulative: is the pool being starved cluster-wide?</span>
<span class="hljs-keyword">SELECT</span> datname,
       parallel_workers_to_launch,
       parallel_workers_launched,
       parallel_workers_to_launch
         <span class="hljs-operator">-</span> parallel_workers_launched <span class="hljs-keyword">AS</span> gap
<span class="hljs-keyword">FROM</span> pg_stat_database
<span class="hljs-keyword">WHERE</span> datname <span class="hljs-operator">=</span> current_database();
</code></pre>
<p>A persistent gap means queries are silently running parallel plans on a single core.</p>
<footer>Scott Mead · Postgres Conference San Jose 2026</footer>

<header>Parallel Query is Silently Stealing Your CPU</header>
<h2 id="the-philosophy">The philosophy</h2>
<p>Parallel query has its place.</p>
<p>If a query, data model, and data distribution are designed correctly,<br />
it can provide tangible benefits.</p>
<p>The trick is ensuring <strong>you</strong> are in control of the parallelism<br />
in use at any given time — <strong>globally, across the cluster</strong>.</p>
<p>The problem with every partial fix is the same:<br />
you can't bound total worker count across concurrent sessions.</p>
<footer>Scott Mead · Postgres Conference San Jose 2026</footer>
</section>

<header>Parallel Query is Silently Stealing Your CPU</header>
<h2 id="step-1-disable-globally">Step 1: Disable globally</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-comment">-- postgresql.conf / ALTER SYSTEM</span>
<span class="hljs-keyword">ALTER</span> <span class="hljs-keyword">SYSTEM</span> <span class="hljs-keyword">SET</span> max_parallel_workers_per_gather <span class="hljs-operator">=</span> <span class="hljs-number">0</span>;
<span class="hljs-keyword">SELECT</span> pg_reload_conf();
</code></pre>
<p>This is not the nuclear option. <strong>This is the baseline.</strong></p>
<p>Parallel query is now off for all workloads, all users, all tables.<br />
Nothing happens without your explicit permission.</p>
<footer>Scott Mead · Postgres Conference San Jose 2026</footer>

<header>Parallel Query is Silently Stealing Your CPU</header>
<h2 id="step-2-enable-intentionally">Step 2: Enable intentionally</h2>
<p><strong>Per-query, using session variables:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SET</span> max_parallel_workers_per_gather <span class="hljs-operator">=</span> <span class="hljs-number">4</span>;
<span class="hljs-keyword">SELECT</span> <span class="hljs-built_in">count</span>(<span class="hljs-operator">*</span>) <span class="hljs-keyword">FROM</span> events <span class="hljs-keyword">WHERE</span> created_at <span class="hljs-operator">&gt;</span> now() <span class="hljs-operator">-</span> <span class="hljs-type">interval</span> <span class="hljs-string">&#x27;1 year&#x27;</span>;
RESET max_parallel_workers_per_gather;
</code></pre>
<p><strong>Per-query, using pg_hint_plan:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-comment">/*+ Parallel(events 4 hard) */</span>
<span class="hljs-keyword">SELECT</span> <span class="hljs-built_in">count</span>(<span class="hljs-operator">*</span>) <span class="hljs-keyword">FROM</span> events <span class="hljs-keyword">WHERE</span> created_at <span class="hljs-operator">&gt;</span> now() <span class="hljs-operator">-</span> <span class="hljs-type">interval</span> <span class="hljs-string">&#x27;1 year&#x27;</span>;
</code></pre>
<p><code>hard</code> means use exactly 4 workers — not &quot;up to 4&quot;.<br />
You asked for it. You got it. Nothing surprises you.</p>
<p><small>pg_hint_plan docs: <a href="https://pg-hint-plan.readthedocs.io/en/latest/hint_details.html">https://pg-hint-plan.readthedocs.io/en/latest/hint_details.html</a></small></p>

<header>Parallel Query is Silently Stealing Your CPU</header>
<h2 id="step-3-enable-per-user-or-per-database">Step 3: Enable per-user or per-database</h2>
<p>Only if you can <strong>guarantee a max concurrency count</strong>.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-comment">-- Analytical user gets parallelism, OLTP users don&#x27;t</span>
<span class="hljs-keyword">ALTER</span> ROLE analyst <span class="hljs-keyword">SET</span> max_parallel_workers_per_gather <span class="hljs-operator">=</span> <span class="hljs-number">4</span>;

<span class="hljs-comment">-- Or scope to a specific database</span>
<span class="hljs-keyword">ALTER</span> DATABASE analytics <span class="hljs-keyword">SET</span> max_parallel_workers_per_gather <span class="hljs-operator">=</span> <span class="hljs-number">4</span>;
</code></pre>
<p>If 10 analyst sessions can run concurrently and each gets 4 workers,<br />
you need <code>max_parallel_workers ≥ 40</code>. Know your math before you enable.</p>

<header>Parallel Query is Silently Stealing Your CPU</header>
<h2 id="why-per-table-is-not-enough">Why per-table is not enough</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">ALTER TABLE</span> events <span class="hljs-keyword">SET</span> (parallel_workers <span class="hljs-operator">=</span> <span class="hljs-number">4</span>);
</code></pre>
<p>This caps workers <em>per query on this table</em>.<br />
It does not cap <em>total workers across all concurrent sessions</em>.</p>
<p>10 sessions hit <code>events</code> simultaneously → up to 40 workers.<br />
You have no cluster-level guarantee.</p>
<p>And when that 11th session arrives and the worker pool is exhausted?<br />
Your analyst gets no error. No warning. No slow query log entry.<br />
They get a parallel plan running on a single CPU —<br />
<strong>untraceable, silent, and slower than if parallelism had never been enabled.</strong></p>
<p>In a mixed workload system, per-table settings trade<br />
one instability for another.</p>
<footer>Scott Mead · Postgres Conference San Jose 2026</footer>

<header>Parallel Query is Silently Stealing Your CPU</header>
<h2 id="what-to-do-monday-morning">What to do Monday morning</h2>
<ol>
<li><strong>Disable parallel query globally.</strong> Make it your baseline, not your last resort.</li>
<li><strong>Re-enable intentionally</strong> — per-query via session GUCs or <code>pg_hint_plan</code>.</li>
<li><strong>Per-user or per-database</strong> only when you can bound concurrency.</li>
<li><strong>Add a worker-count panel</strong> to your monitoring — <code>pg_stat_activity</code>.</li>
<li><strong>Watch for <code>Workers Launched: 0</code></strong> — the silent parallel plan with no workers.</li>
</ol>
<blockquote>
<p>Parallelism is not opt-in by default.<br />
Make it opt-in by design.</p>
</blockquote>
