<h1 id="the-premise">The Premise</h1>
<ul>
<li>
<p>Postgres is thirty years old.</p>
</li>
<li>
<p>I've been working on it for 22.</p>
</li>
<li>
<p>We're all doing the same [bad] things over and over.</p>
</li>
</ul>
<br />
<ul>
<li>Every mistake here &quot;works on my laptop&quot;</li>
<li>Every one shows up in metrics</li>
<li>They all seem innocent at first</li>
</ul>
<footer>Scott Mead · <a href="mailto:scott@meads.us">scott@meads.us</a> · NYC Postgres Meetup · 2026 · Creative Commons Attribution License</footer>

<h1 id="mistake-0-its-always-connections">Mistake #0: it's always connections</h1>
<p>Postgres runs a process per connection.</p>
<br />
<ul>
<li><strong>connect</strong> is <code>fork()</code>, memory, authentication, a cold catalog cache, before any row is touched</li>
<li><strong>a 5 ms query</strong> connect:~2ms  run: 5 ms
<ul>
<li>Without a pool, every request is a connect / disconnect</li>
</ul>
</li>
<li><strong>rate</strong> is the issue. A number of connections is one problem, a high rate of connections grinds the system</li>
</ul>
<p><small>A pool connects once and reuses the backend</small></p>

<h1 id="where-the-rate-comes-from">Where the rate comes from</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">handle</span>(<span class="hljs-params">request</span>):
    conn = psycopg2.connect(DSN)        <span class="hljs-comment"># a new connection per request, no pool</span>
    <span class="hljs-keyword">try</span>:
        <span class="hljs-keyword">with</span> conn.cursor() <span class="hljs-keyword">as</span> cur:
            cur.execute(<span class="hljs-string">&quot;SELECT ... WHERE id = %s&quot;</span>, (request.user_id,))
            <span class="hljs-keyword">return</span> cur.fetchone()
    <span class="hljs-keyword">finally</span>:
        conn.close()                    <span class="hljs-comment"># torn down again. Next request: fork again</span>
</code></pre>
<ul>
<li>Or forty app servers, each with a pool of fifty per core</li>
<li>Or reconnect with no delay</li>
</ul>

<h1 id="use-a-pooled-connection">Use a pooled connection</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> psycopg2 <span class="hljs-keyword">import</span> pool

db = pool.ThreadedConnectionPool(minconn=<span class="hljs-number">2</span>, maxconn=<span class="hljs-number">10</span>, dsn=DSN)   <span class="hljs-comment"># once, at startup</span>

<span class="hljs-keyword">def</span> <span class="hljs-title function_">handle</span>(<span class="hljs-params">request</span>):
    conn = db.getconn()                 <span class="hljs-comment"># borrow an open connection, no fork</span>
    <span class="hljs-keyword">try</span>:
        <span class="hljs-keyword">with</span> conn.cursor() <span class="hljs-keyword">as</span> cur:
            cur.execute(<span class="hljs-string">&quot;SELECT ... WHERE id = %s&quot;</span>, (request.user_id,))
            <span class="hljs-keyword">return</span> cur.fetchone()
    <span class="hljs-keyword">finally</span>:
        db.putconn(conn)                <span class="hljs-comment"># give it back, still connected</span>
</code></pre>
<p><small>Same pattern in psycopg 3, HikariCP in Java, and <code>database/sql</code> in Go</small></p>

<text id="mv-sw65" x="624" y="237" fill="#c3c2b7" font-size="11.5" text-anchor="start" opacity="0">two rows, the page as VACUUM left it</text>
<text id="mv-sw66" x="624" y="237" fill="#199e70" font-size="11.5" text-anchor="start" opacity="0">heap order: page 0 top to bottom, then page 1. No ORDER BY</text>
<text id="mv-sw67" x="624" y="279" fill="#d95926" font-size="14" text-anchor="start" opacity="0">transaction 7500, months later, a new user</text>
<text id="mv-sw68" x="624" y="279" fill="#d95926" font-size="14" text-anchor="start" opacity="0">transaction 502, marry me</text>
<text id="mv-sw69" x="624" y="279" fill="#199e70" font-size="14" text-anchor="start" opacity="0">autovacuum, or VACUUM users</text>
<text id="mv-sw70" x="624" y="279" fill="#d95926" font-size="14" text-anchor="start" opacity="0">transaction 504, a new user</text>
<text id="mv-sw71" x="624" y="279" fill="#199e70" font-size="14" text-anchor="start" opacity="0">take two: same page, a different newcomer</text>
<text id="mv-sw72" x="624" y="279" fill="#d95926" font-size="14" text-anchor="start" opacity="0">transaction 7500, months later, a new user</text>
<text id="mv-sw73" x="624" y="305" fill="#f0efec" font-size="12.5" text-anchor="start" opacity="0" font-family="DejaVu Sans Mono, Menlo, monospace">BEGIN;</text>
<text id="mv-sw74" x="624" y="305" fill="#f0efec" font-size="12.5" text-anchor="start" opacity="0" font-family="DejaVu Sans Mono, Menlo, monospace">VACUUM users;</text>
<text id="mv-sw75" x="624" y="305" fill="#f0efec" font-size="12.5" text-anchor="start" opacity="0" font-family="DejaVu Sans Mono, Menlo, monospace">BEGIN;</text>
<text id="mv-sw76" x="624" y="305" fill="#c3c2b7" font-size="12.5" text-anchor="start" opacity="0" font-family="DejaVu Sans Mono, Menlo, monospace">rewind to step 8: page 0 has 48 bytes free</text>
<text id="mv-sw77" x="624" y="305" fill="#f0efec" font-size="12.5" text-anchor="start" opacity="0" font-family="DejaVu Sans Mono, Menlo, monospace">BEGIN;</text>
<text id="mv-sw78" x="624" y="325" fill="#f0efec" font-size="12.5" text-anchor="start" opacity="0" font-family="DejaVu Sans Mono, Menlo, monospace">INSERT INTO users</text>
<text id="mv-sw79" x="624" y="325" fill="#f0efec" font-size="12.5" text-anchor="start" opacity="0" font-family="DejaVu Sans Mono, Menlo, monospace">UPDATE users SET last_name = 'Smith-Rivera'</text>
<text id="mv-sw80" x="624" y="325" fill="#c3c2b7" font-size="12.5" text-anchor="start" opacity="0" font-family="DejaVu Sans Mono, Menlo, monospace">dead versions become free space on the page</text>
<text id="mv-sw81" x="624" y="325" fill="#f0efec" font-size="12.5" text-anchor="start" opacity="0" font-family="DejaVu Sans Mono, Menlo, monospace">INSERT INTO users VALUES (3, 'Susie', 'Rivera');</text>
<text id="mv-sw82" x="624" y="325" fill="#c3c2b7" font-size="12.5" text-anchor="start" opacity="0" font-family="DejaVu Sans Mono, Menlo, monospace">the FSM still points at page 0</text>
<text id="mv-sw83" x="624" y="325" fill="#f0efec" font-size="12.5" text-anchor="start" opacity="0" font-family="DejaVu Sans Mono, Menlo, monospace">INSERT INTO users</text>
<text id="mv-sw84" x="624" y="343" fill="#f0efec" font-size="12.5" text-anchor="start" opacity="0" font-family="DejaVu Sans Mono, Menlo, monospace">  VALUES (4, 'Bartholomew', 'Featherstonehaugh');</text>
<text id="mv-sw85" x="624" y="343" fill="#f0efec" font-size="12.5" text-anchor="start" opacity="0" font-family="DejaVu Sans Mono, Menlo, monospace">  WHERE id = 1;</text>
<text id="mv-sw86" x="624" y="343" fill="#c3c2b7" font-size="12.5" text-anchor="start" opacity="0" font-family="DejaVu Sans Mono, Menlo, monospace">the free space map (FSM) records how much</text>
<text id="mv-sw87" x="624" y="343" fill="#f0efec" font-size="12.5" text-anchor="start" opacity="0" font-family="DejaVu Sans Mono, Menlo, monospace">  VALUES (4, 'Bartholomew', 'Featherstonehaugh');</text>
<text id="mv-sw88" x="624" y="363" fill="#199e70" font-size="12.5" text-anchor="start" opacity="0" font-family="DejaVu Sans Mono, Menlo, monospace">COMMIT;</text>
<text id="mv-sw89" x="624" y="363" fill="#199e70" font-size="12.5" text-anchor="start" opacity="0" font-family="DejaVu Sans Mono, Menlo, monospace">COMMIT;</text>
<text id="mv-sw90" x="624" y="363" fill="#199e70" font-size="12.5" text-anchor="start" opacity="0" font-family="DejaVu Sans Mono, Menlo, monospace">COMMIT;</text>
<text id="mv-sw91" x="624" y="363" fill="#199e70" font-size="12.5" text-anchor="start" opacity="0" font-family="DejaVu Sans Mono, Menlo, monospace">COMMIT;</text>
<text id="mv-sw92" x="624" y="379" fill="#e5484d" font-size="11.5" text-anchor="start" opacity="0">64 bytes. Page 0 has 48 free, so the table grows a page</text>
<text id="mv-sw93" x="624" y="379" fill="#e0a52a" font-size="11.5" text-anchor="start" opacity="0">in flight: holds xid 502 and a connection</text>
<text id="mv-sw94" x="624" y="379" fill="#199e70" font-size="11.5" text-anchor="start" opacity="0">committed</text>
<text id="mv-sw95" x="624" y="379" fill="#c3c2b7" font-size="11.5" text-anchor="start" opacity="0">no lock on the table, readers and writers carry on</text>
<text id="mv-sw96" x="624" y="379" fill="#199e70" font-size="11.5" text-anchor="start" opacity="0">48 bytes after padding. The FSM sent her to page 0</text>
<text id="mv-sw97" x="624" y="379" fill="#c3c2b7" font-size="11.5" text-anchor="start" opacity="0">what if the next row had been bigger</text>
<text id="mv-sw98" x="624" y="379" fill="#e5484d" font-size="11.5" text-anchor="start" opacity="0">64 bytes. Page 0 has 48 free, so the table grows a page</text>
<rect id="mv-p1cover1" x="608" y="38" width="474" height="209" rx="8" fill="#1a1a19" fill-opacity="1" stroke="#1a1a19" stroke-width="0" />
<rect id="mv-p2cover1" x="608" y="253" width="474" height="134" rx="8" fill="#1a1a19" fill-opacity="1" stroke="#1a1a19" stroke-width="0" />
<text id="mv-sw99" x="24" y="30" fill="#f0efec" font-size="19" text-anchor="start" opacity="0">the whole story</text>
<text id="mv-sw100" x="24" y="30" fill="#f0efec" font-size="19" text-anchor="start" opacity="0">1. Bulk load</text>
<text id="mv-sw101" x="24" y="30" fill="#f0efec" font-size="19" text-anchor="start" opacity="0">2. A reader takes a snapshot</text>
<text id="mv-sw102" x="24" y="30" fill="#f0efec" font-size="19" text-anchor="start" opacity="0">3. UPDATE writes a new version</text>
<text id="mv-sw103" x="24" y="30" fill="#f0efec" font-size="19" text-anchor="start" opacity="0">4. The reader still sees Smith</text>
<text id="mv-sw104" x="24" y="30" fill="#f0efec" font-size="19" text-anchor="start" opacity="0">5. COMMIT</text>
<text id="mv-sw105" x="24" y="30" fill="#f0efec" font-size="19" text-anchor="start" opacity="0">6. New statement, new snapshot</text>
<text id="mv-sw106" x="24" y="30" fill="#f0efec" font-size="19" text-anchor="start" opacity="0">7. A dead version</text>
<text id="mv-sw107" x="24" y="30" fill="#f0efec" font-size="19" text-anchor="start" opacity="0">8. VACUUM frees 48 bytes</text>
<text id="mv-sw108" x="24" y="30" fill="#f0efec" font-size="19" text-anchor="start" opacity="0">9. A row that fits</text>
<text id="mv-sw109" x="24" y="30" fill="#f0efec" font-size="19" text-anchor="start" opacity="0">10. Rewind to the vacuumed page</text>
<text id="mv-sw110" x="24" y="30" fill="#f0efec" font-size="19" text-anchor="start" opacity="0">11. A row that does not fit</text>
<text id="mv-cap1" x="20" y="438" fill="#f0efec" font-size="14" text-anchor="start" opacity="0">dead versions become free bytes. A row that fits reuses them; a row that does not grows the table and leaves the gap behind</text>
<text id="mv-cap2" x="20" y="438" fill="#f0efec" font-size="14" text-anchor="start" opacity="0">xid 500 bulk-loads the table in one transaction and commits. The page is otherwise full</text>
<text id="mv-cap3" x="20" y="438" fill="#f0efec" font-size="14" text-anchor="start" opacity="0">501 reads. Its snapshot is everything committed before the statement started</text>
<text id="mv-cap4" x="20" y="438" fill="#f0efec" font-size="14" text-anchor="start" opacity="0">502 updates row 1. Postgres never overwrites: a new version is written, and the old one gets xmax = 502</text>
<text id="mv-cap5" x="20" y="438" fill="#f0efec" font-size="14" text-anchor="start" opacity="0">501 reads again and still sees Smith. 502 has not committed, so its version is invisible to everyone else</text>
<text id="mv-cap6" x="20" y="438" fill="#f0efec" font-size="14" text-anchor="start" opacity="0">502 commits. The page does not change; the commit log now says 502 is committed</text>
<text id="mv-cap7" x="20" y="438" fill="#f0efec" font-size="14" text-anchor="start" opacity="0">501's next statement takes a new snapshot and sees Smith-Rivera (READ COMMITTED, the default)</text>
<text id="mv-cap8" x="20" y="438" fill="#f0efec" font-size="14" text-anchor="start" opacity="0">the old version is dead. It stays on the page until VACUUM, and every reader steps over it until then</text>
<text id="mv-cap9" x="20" y="438" fill="#f0efec" font-size="14" text-anchor="start" opacity="0">VACUUM compacts the page, frees the dead version's 48 bytes, and records them in the free space map</text>
<text id="mv-cap10" x="20" y="438" fill="#f0efec" font-size="14" text-anchor="start" opacity="0">504 inserts Susie Rivera, 48 bytes after padding. The FSM points at page 0, so she takes the freed space</text>
<text id="mv-cap11" x="20" y="438" fill="#f0efec" font-size="14" text-anchor="start" opacity="0">rewind to step 8. Same page, 48 bytes free. Now a different newcomer, months later</text>
<text id="mv-cap12" x="20" y="438" fill="#f0efec" font-size="14" text-anchor="start" opacity="0">7500 inserts a 64-byte row. 48 is not enough, so the table grows a page. The 48 bytes stay empty: bloat</text>

<h1 id="its-always-connections">It's always connections</h1>
<ul>
<li>The reader steps over 364 dead versions to find the live one</li>
<li>221 pages where there should be one. The row is a disk read, not a cache hit</li>
<li>Every query holds its connection for the extra pages. Same traffic, longer holds</li>
<li>The pool opens more connections to keep up, months after the schema decision</li>
<li>Autovacuum reads and rewrites the same pages, competing with the queries for the disk</li>
</ul>
<footer>Scott Mead · <a href="mailto:scott@meads.us">scott@meads.us</a> · NYC Postgres Meetup · 2026 · Creative Commons Attribution License</footer>
</section>

<text id="pb-cap1" x="20" y="438" fill="#f0efec" font-size="15" text-anchor="start" opacity="0">every query reads one page, holds its connection for a millisecond, and gives it back</text>
<text id="pb-cap2" x="20" y="438" fill="#f0efec" font-size="15" text-anchor="start" opacity="0">the table bloats. The same query reads 20 pages, then 80. Each one holds its connection longer</text>
<text id="pb-cap3" x="20" y="438" fill="#f0efec" font-size="15" text-anchor="start" opacity="0">no free connection, so the pool opens a few more. They fill the same way: same traffic, longer holds</text>
<text id="pb-cap4" x="20" y="438" fill="#f0efec" font-size="15" text-anchor="start" opacity="0">every server connection is busy reading dead versions. The pool is exhausted and the app is down</text>
<text id="pb-cap5" x="20" y="438" fill="#f0efec" font-size="15" text-anchor="start">221 pages per row. The database is saturated, the app is down, and not a line of code changed</text>

<h1 id="the-fix">The fix</h1>
<ul>
<li>The document grows with every login, so every version is bigger than the gap the last one freed</li>
<li>Facts that accumulate go in a table. The <code>users</code> row never changes again</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-comment">-- before: one login rewrites the whole profile, 9,296 bytes by day 365</span>
<span class="hljs-keyword">UPDATE</span> users
   <span class="hljs-keyword">SET</span> profile <span class="hljs-operator">=</span> jsonb_set(profile, <span class="hljs-string">&#x27;{login_history}&#x27;</span>,
                           profile<span class="hljs-operator">-</span><span class="hljs-operator">&gt;</span><span class="hljs-string">&#x27;login_history&#x27;</span> <span class="hljs-operator">||</span> to_jsonb(now()))
 <span class="hljs-keyword">WHERE</span> id <span class="hljs-operator">=</span> <span class="hljs-number">1</span>;

<span class="hljs-comment">-- after: a table. INSERT one 40-byte row, UPDATE nothing</span>
<span class="hljs-keyword">CREATE TABLE</span> login_history (
       user_id       <span class="hljs-type">bigint</span>       <span class="hljs-keyword">NOT NULL</span> <span class="hljs-keyword">REFERENCES</span> users (id),
       logged_in_at  timestamptz  <span class="hljs-keyword">NOT NULL</span> <span class="hljs-keyword">DEFAULT</span> now(),
       <span class="hljs-keyword">PRIMARY KEY</span> (user_id, logged_in_at)
);

<span class="hljs-keyword">INSERT INTO</span> login_history (user_id) <span class="hljs-keyword">VALUES</span> (<span class="hljs-number">1</span>);
</code></pre>
<footer>Scott Mead · <a href="mailto:scott@meads.us">scott@meads.us</a> · NYC Postgres Meetup · 2026 · Creative Commons Attribution License</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-footer="Scott Mead · scott@meads.us · NYC Postgres Meetup · 2026 · Creative Commons Attribution License" data-class="code-md" data-theme="pgslides" lang="C" class="code-md" data-marpit-pagination="18" style="--paginate:true;--footer:Scott Mead · scott@meads.us · NYC Postgres Meetup · 2026 · Creative Commons Attribution License;--class:code-md;--theme:pgslides;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="better-not-best">Better, not best</h1>
<ul>
<li>Overwrite a field instead of appending to a list. Every version is the same 110 bytes</li>
<li>The gap vacuum frees fits the next version, so the table stops growing</li>
<li>Still one dead version per login. Vacuum has to keep up, and a pinned horizon still bites</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-comment">-- same size every time: replace last_login, keep no history in the document</span>
<span class="hljs-keyword">UPDATE</span> users
   <span class="hljs-keyword">SET</span> profile <span class="hljs-operator">=</span> jsonb_set(profile, <span class="hljs-string">&#x27;{last_login}&#x27;</span>, to_jsonb(now()))
 <span class="hljs-keyword">WHERE</span> id <span class="hljs-operator">=</span> <span class="hljs-number">1</span>;
</code></pre>
<footer>Scott Mead · <a href="mailto:scott@meads.us">scott@meads.us</a> · NYC Postgres Meetup · 2026 · Creative Commons Attribution License</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-footer="Scott Mead · scott@meads.us · NYC Postgres Meetup · 2026 · Creative Commons Attribution License" data-theme="pgslides" lang="C" data-marpit-pagination="19" style="--paginate:true;--footer:Scott Mead · scott@meads.us · NYC Postgres Meetup · 2026 · Creative Commons Attribution License;--theme:pgslides;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="mistake-2-we-leave-transactions-open">Mistake #2: we leave transactions open</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">cur.execute(<span class="hljs-string">&quot;SELECT * FROM orders WHERE id = %s FOR UPDATE&quot;</span>, (oid,))

resp = requests.post(<span class="hljs-string">&quot;https://api.payments-provider.com/v1/charges&quot;</span>,     <span class="hljs-comment"># HTTP to a third party</span>
                     json={<span class="hljs-string">&quot;card&quot;</span>: card, <span class="hljs-string">&quot;amount&quot;</span>: amount})

cur.execute(<span class="hljs-string">&quot;UPDATE orders SET status = &#x27;paid&#x27; WHERE id = %s&quot;</span>, (oid,))
conn.commit()
</code></pre>
<div style="height: 0.8em"></div>
<ul>
<li>Autocommit is off*; the SELECT opened a transaction</li>
<li>It holds the row lock, and it holds a transaction id</li>
<li>In READ COMMITTED an xid pins the horizon the way a snapshot does</li>
</ul>
<p><small>* in psycopg2/3.  JDBC, others differ here</small></p>
<footer>Scott Mead · <a href="mailto:scott@meads.us">scott@meads.us</a> · NYC Postgres Meetup · 2026 · Creative Commons Attribution License</footer>
</section>

<h1 id="add-a-timeout">Add a timeout?</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">cur.execute(<span class="hljs-string">&quot;SELECT * FROM orders WHERE id = %s FOR UPDATE&quot;</span>, (oid,))

resp = requests.post(<span class="hljs-string">&quot;https://api.payments-provider.com/v1/charges&quot;</span>,     <span class="hljs-comment"># HTTP to a third party</span>
                     json={<span class="hljs-string">&quot;card&quot;</span>: card, <span class="hljs-string">&quot;amount&quot;</span>: amount}, timeout=<span class="hljs-number">30</span>)  <span class="hljs-comment"># ? to 30 seconds, sometimes never</span>

cur.execute(<span class="hljs-string">&quot;UPDATE orders SET status = &#x27;paid&#x27; WHERE id = %s&quot;</span>, (oid,))
conn.commit()
</code></pre>
<div style="height: 0.8em"></div>
<ul>
<li>Autocommit is off*; the SELECT opened a transaction</li>
<li>&lt;= 30 second <code>idle in transaction</code>. At 300 commits a second, 9,000 can pile up</li>
<li>It holds the row lock, and it holds a transaction id</li>
<li>In READ COMMITTED an xid pins the horizon the way a snapshot does</li>
</ul>
<p><small>* in psycopg2/3.  JDBC, others differ here</small></p>

<text id="cap1" x="20" y="438" fill="#f0efec" font-size="15" text-anchor="start" opacity="0">transactions open, call the payments API, and commit in 50 ms. A connection is idle in transaction for a moment, then free</text>
<text id="cap2" x="20" y="438" fill="#f0efec" font-size="15" text-anchor="start" opacity="0">the payments API slows down. A request opens a transaction, calls it, and holds its server connection while it waits</text>
<text id="cap3" x="20" y="438" fill="#f0efec" font-size="15" text-anchor="start" opacity="0">no free connection, so the pool opens a few more. Each request calls the API inside its transaction, and holds one</text>
<text id="cap4" x="20" y="438" fill="#f0efec" font-size="15" text-anchor="start" opacity="0">every server connection is held by a transaction waiting on HTTP. The pool is exhausted and the database is idle</text>
<text id="cap5" x="20" y="438" fill="#f0efec" font-size="15" text-anchor="start">the payments API recovers. Every connection is still held and every app instance is still stuck</text>

<h1 id="detection-1">Detection</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-comment">-- backends holding a snapshot or an xid, oldest first</span>
<span class="hljs-keyword">SELECT</span> pid, datname, application_name, state,
       age(backend_xmin) <span class="hljs-keyword">AS</span> xmin_age,
       age(backend_xid) <span class="hljs-keyword">AS</span> xid_age,
       now() <span class="hljs-operator">-</span> xact_start <span class="hljs-keyword">AS</span> xact_time
  <span class="hljs-keyword">FROM</span> pg_stat_activity
<span class="hljs-keyword">WHERE</span> backend_type <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;client backend&#x27;</span>
  <span class="hljs-keyword">AND</span> (backend_xmin <span class="hljs-keyword">IS</span> <span class="hljs-keyword">NOT NULL</span> <span class="hljs-keyword">OR</span> backend_xid <span class="hljs-keyword">IS</span> <span class="hljs-keyword">NOT NULL</span>)
<span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> greatest(age(backend_xmin), age(backend_xid)) <span class="hljs-keyword">DESC</span>;
</code></pre>
<p><br /><br /></p>
<ul>
<li><code>xmin_age</code> is how many transactions committed since this one started.</li>
<li><code>xact_time</code> 10s * 500 xact/sec = 5,000 commits</li>
<li>Slots and prepared transactions: <code>pg_replication_slots</code>, <code>pg_prepared_xacts</code>, both in the demo file</li>
</ul>
<footer>Scott Mead · <a href="mailto:scott@meads.us">scott@meads.us</a> · NYC Postgres Meetup · 2026 · Creative Commons Attribution License</footer>
</section>

<h1 id="the-fix-1">The fix</h1>
<ul>
<li><code>FOR UPDATE</code> plus the charge was never one transaction. Postgres cannot roll back an HTTP call</li>
<li>Autocommit on. Charge first with an idempotency key, then one guarded <code>UPDATE</code></li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># borrow a connection. The pool was built with autocommit on</span>
conn = pool.getconn()

<span class="hljs-comment"># the charge runs with no transaction open</span>
resp = requests.post(<span class="hljs-string">&quot;https://api.payments-provider.com/v1/charges&quot;</span>,
                     headers={<span class="hljs-string">&quot;Idempotency-Key&quot;</span>: <span class="hljs-string">f&quot;order-<span class="hljs-subst">{oid}</span>&quot;</span>},
                     data={<span class="hljs-string">&quot;amount&quot;</span>: amount, <span class="hljs-string">&quot;currency&quot;</span>: <span class="hljs-string">&quot;usd&quot;</span>,
                           <span class="hljs-string">&quot;customer&quot;</span>: cust, <span class="hljs-string">&quot;confirm&quot;</span>: <span class="hljs-string">&quot;true&quot;</span>}, timeout=<span class="hljs-number">30</span>)

<span class="hljs-comment"># one UPDATE. The status guard replaces the row lock</span>
cur.execute(<span class="hljs-string">&quot;UPDATE orders SET status = &#x27;paid&#x27; &quot;</span>
            <span class="hljs-string">&quot;WHERE id = %s AND status = &#x27;pending&#x27;&quot;</span>, (oid,))

<span class="hljs-comment"># the only transaction. SQL only, milliseconds</span>
<span class="hljs-keyword">with</span> conn.transaction():
    cur.execute(<span class="hljs-string">&quot;INSERT INTO ledger ...&quot;</span>)
    cur.execute(<span class="hljs-string">&quot;UPDATE balances ...&quot;</span>)
</code></pre>

<h1 id="the-fix-server-side">The fix, server side</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">ALTER</span> ROLE app_rw <span class="hljs-keyword">SET</span> idle_in_transaction_session_timeout <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;30s&#x27;</span>;
<span class="hljs-keyword">ALTER</span> ROLE app_rw <span class="hljs-keyword">SET</span> transaction_timeout <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;5min&#x27;</span>;      <span class="hljs-comment">-- PG 17+: the whole transaction, idle or not</span>
</code></pre>
<p><br /><br /></p>
<ul>
<li>Per role: the app and the reports need different numbers</li>
<li>Pick the seconds from your commit rate. 30 seconds at 300 commits a second is 9,000 transactions held back</li>
</ul>
<table>
<thead>
<tr>
<th></th>
<th></th>
<th></th>
</tr>
</thead>
<tbody>
<tr>
<td>alerting today</td>
<td>oldest idle-in-transaction age &gt; 30 s; transactions open &gt; 60 s</td>
<td>yes</td>
</tr>
<tr>
<td></td>
<td>xid age in transactions, the measure that matters; replication slots, prepared transactions</td>
<td>no</td>
</tr>
<tr>
<td>verify</td>
<td>rerun the detection query; <code>xmin_age</code> falls back to the hundreds</td>
<td></td>
</tr>
</tbody>
</table>
<footer>Scott Mead · <a href="mailto:scott@meads.us">scott@meads.us</a> · NYC Postgres Meetup · 2026 · Creative Commons Attribution License</footer>
</section>

<h1 id="mistake-3-bulk-delete-instead-of-partitioning">Mistake #3: bulk DELETE instead of partitioning</h1>
<p>Replication lag and a WAL spike at 02:00</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-comment">-- the nightly retention job</span>
<span class="hljs-keyword">DELETE</span> <span class="hljs-keyword">FROM</span> events <span class="hljs-keyword">WHERE</span> created_at <span class="hljs-operator">&lt;</span> now() <span class="hljs-operator">-</span> <span class="hljs-type">interval</span> <span class="hljs-string">&#x27;90 days&#x27;</span>;
</code></pre>
<p><code>events</code>: 2,000,000,000 rows, 90 days retention, 6 indexes<br />
<br /><br />
<br /></p>
<table>
<thead>
<tr>
<th></th>
<th></th>
<th></th>
</tr>
</thead>
<tbody>
<tr>
<td>daily rows removed</td>
<td>~22,000,000</td>
<td>one day's worth</td>
</tr>
<tr>
<td>dead tuples in the heap</td>
<td>22,000,000</td>
<td>DELETE only marks them</td>
</tr>
<tr>
<td>WAL at delete time</td>
<td>22,000,000</td>
<td>also replayed on every replica</td>
</tr>
<tr>
<td>transaction</td>
<td>hours</td>
<td>holding an xid and a snapshot the whole time (Mistake #2)</td>
</tr>
<tr>
<td>vacuum</td>
<td></td>
<td>WAL traffic (heap + all indexes)</td>
</tr>
</tbody>
</table>
<footer>Scott Mead · <a href="mailto:scott@meads.us">scott@meads.us</a> · NYC Postgres Meetup · 2026 · Creative Commons Attribution License</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-footer="Scott Mead · scott@meads.us · NYC Postgres Meetup · 2026 · Creative Commons Attribution License" data-theme="pgslides" lang="C" data-marpit-pagination="30" style="--paginate:true;--footer:Scott Mead · scott@meads.us · NYC Postgres Meetup · 2026 · Creative Commons Attribution License;--theme:pgslides;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="detection-2">Detection</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-comment">-- which statement wrote last night&#x27;s WAL spike?</span>
<span class="hljs-keyword">SELECT</span> queryid, calls, <span class="hljs-keyword">rows</span>, wal_bytes, total_exec_time
  <span class="hljs-keyword">FROM</span> pg_stat_statements
<span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> wal_bytes <span class="hljs-keyword">DESC</span>
LIMIT <span class="hljs-number">5</span>;

<span class="hljs-comment">-- dead rows by table</span>
<span class="hljs-keyword">SELECT</span> relname, n_dead_tup, n_live_tup, last_autovacuum
  <span class="hljs-keyword">FROM</span> pg_stat_user_tables
<span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> n_dead_tup <span class="hljs-keyword">DESC</span>
LIMIT <span class="hljs-number">5</span>;
</code></pre>
<ul>
<li><code>wal_bytes</code> over 1 GB for one statement with <code>rows</code> in the millions</li>
<li><code>n_dead_tup</code> above a fifth of <code>n_live_tup</code> and <code>last_autovacuum</code> hours old (dead rows).</li>
<li>Until you can partition: bounded batches, commit each one</li>
</ul>
<footer>Scott Mead · <a href="mailto:scott@meads.us">scott@meads.us</a> · NYC Postgres Meetup · 2026 · Creative Commons Attribution License</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-footer="Scott Mead · scott@meads.us · NYC Postgres Meetup · 2026 · Creative Commons Attribution License" data-class="code-sm kv" data-theme="pgslides" lang="C" class="code-sm kv" data-marpit-pagination="31" style="--paginate:true;--footer:Scott Mead · scott@meads.us · NYC Postgres Meetup · 2026 · Creative Commons Attribution License;--class:code-sm kv;--theme:pgslides;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="the-fix-2">The fix</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-comment">-- events already exists. Build the partitioned table next to it; the key must include created_at</span>
<span class="hljs-keyword">CREATE TABLE</span> events_p (<span class="hljs-keyword">LIKE</span> events INCLUDING DEFAULTS, <span class="hljs-keyword">PRIMARY KEY</span> (id, created_at))
  <span class="hljs-keyword">PARTITION</span> <span class="hljs-keyword">BY</span> <span class="hljs-keyword">RANGE</span> (created_at);
<span class="hljs-keyword">CREATE TABLE</span> events_p_2026_08 <span class="hljs-keyword">PARTITION</span> <span class="hljs-keyword">OF</span> events_p <span class="hljs-keyword">FOR</span> <span class="hljs-keyword">VALUES</span> <span class="hljs-keyword">FROM</span> (<span class="hljs-string">&#x27;2026-08-01&#x27;</span>) <span class="hljs-keyword">TO</span> (<span class="hljs-string">&#x27;2026-09-01&#x27;</span>);
<span class="hljs-comment">-- one partition per month back to the retention edge, indexes on events_p; pg_partman keeps the calendar</span>
<span class="hljs-keyword">INSERT INTO</span> events_p <span class="hljs-keyword">SELECT</span> <span class="hljs-operator">*</span> <span class="hljs-keyword">FROM</span> events <span class="hljs-keyword">WHERE</span> created_at <span class="hljs-operator">&gt;=</span> <span class="hljs-string">&#x27;2026-08-01&#x27;</span> <span class="hljs-keyword">AND</span> created_at <span class="hljs-operator">&lt;</span> <span class="hljs-string">&#x27;2026-09-01&#x27;</span>;   <span class="hljs-comment">-- a month per batch</span>
<span class="hljs-keyword">SET</span> lock_timeout <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;2s&#x27;</span>;                                          <span class="hljs-comment">-- the swap is two renames</span>
<span class="hljs-keyword">BEGIN</span>; <span class="hljs-keyword">ALTER TABLE</span> events RENAME <span class="hljs-keyword">TO</span> events_old; <span class="hljs-keyword">ALTER TABLE</span> events_p RENAME <span class="hljs-keyword">TO</span> events; <span class="hljs-keyword">COMMIT</span>;
<span class="hljs-comment">-- from now on retention is a catalog change. PG 14+. not in a transaction block. waits for open transactions (Mistake #2)</span>
<span class="hljs-keyword">ALTER TABLE</span> events DETACH <span class="hljs-keyword">PARTITION</span> events_p_2026_08 CONCURRENTLY;
<span class="hljs-keyword">DROP</span> <span class="hljs-keyword">TABLE</span> events_p_2026_08;
</code></pre>
<table>
<thead>
<tr>
<th></th>
<th></th>
</tr>
</thead>
<tbody>
<tr>
<td>rows removed</td>
<td>~680,000,000, a month</td>
</tr>
<tr>
<td>dead tuples</td>
<td>0</td>
</tr>
<tr>
<td>WAL</td>
<td>catalog rows only</td>
</tr>
<tr>
<td>wall clock</td>
<td>milliseconds, once open transactions on <code>events</code> finish</td>
</tr>
</tbody>
</table>
<table>
<thead>
<tr>
<th></th>
<th></th>
<th></th>
</tr>
</thead>
<tbody>
<tr>
<td>alerting today</td>
<td>dead tuple ratio &gt; 20% on large tables; replication lag</td>
<td>yes, hours later</td>
</tr>
<tr>
<td></td>
<td>the statement itself (WAL bytes per statement, rows deleted)</td>
<td>no</td>
</tr>
<tr>
<td>verify</td>
<td><code>n_tup_del</code> stays flat on the parent; the drop is a catalog change</td>
<td></td>
</tr>
</tbody>
</table>

<h1 id="its-always-connections-2">It's always connections</h1>
<ul>
<li>The bulk <code>DELETE</code> is one long-running transaction. Its xid pins the horizon for hours</li>
<li>Vacuum is held back the whole time. Dead versions pile up in every table, not just this one</li>
<li>The index pages the <code>DELETE</code> empties stay allocated. Every <code>INSERT</code> and <code>UPDATE</code> walks a bigger index</li>
<li>Slower writes hold their connection longer. Same traffic, longer holds, the pool opens more</li>
</ul>

<h1 id="mistake-4-unused-indexes">Mistake #4: unused indexes</h1>
<ul>
<li>UPDATE latency slowly increasing</li>
<li>Connection counts up 1% month-over-month</li>
</ul>

<h1 id="write-amplification">Write amplification</h1>
<p>Measured on 1M rows. Extrapolated to 1B</p>
<table>
<thead>
<tr>
<th></th>
<th>1M rows, measured</th>
<th>1B rows at 5,000 UPDATE/s</th>
</tr>
</thead>
<tbody>
<tr>
<td>heap + primary key on disk</td>
<td>179 MB</td>
<td>179 GB</td>
</tr>
<tr>
<td>seven int indexes on disk</td>
<td>141 MB</td>
<td>141 GB</td>
</tr>
<tr>
<td>page writes per UPDATE, primary key only</td>
<td>2</td>
<td>10,000 per second</td>
</tr>
<tr>
<td>page writes per UPDATE, seven indexes</td>
<td>9</td>
<td>45,000 per second</td>
</tr>
<tr>
<td>WAL per UPDATE, primary key only</td>
<td>311 B</td>
<td>134 GB per day</td>
</tr>
<tr>
<td>WAL per UPDATE, seven indexes</td>
<td>855 B</td>
<td>369 GB per day</td>
</tr>
</tbody>
</table>
<br />
<ul>
<li>1M: <code>UPDATE</code> takes 0.2 ms with 0 indexes or 7. Everything is in RAM</li>
<li>1B: indexes compete with heap for RAM.</li>
<li>The <code>UPDATE</code> holds its connection through every one of those reads</li>
<li>Every replica and the WAL archive carry the extra 235 GB a day</li>
</ul>
<footer>Scott Mead · <a href="mailto:scott@meads.us">scott@meads.us</a> · NYC Postgres Meetup · 2026 · Creative Commons Attribution License</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-footer="Scott Mead · scott@meads.us · NYC Postgres Meetup · 2026 · Creative Commons Attribution License" data-theme="pgslides" lang="C" data-marpit-pagination="35" style="--paginate:true;--footer:Scott Mead · scott@meads.us · NYC Postgres Meetup · 2026 · Creative Commons Attribution License;--theme:pgslides;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="detection-3">Detection</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-comment">-- indexes with zero scans since the stats reset, largest first</span>
<span class="hljs-keyword">SELECT</span> s.relname, s.indexrelname, s.idx_scan, s.last_idx_scan,       <span class="hljs-comment">-- last_idx_scan: PG 16+</span>
       pg_relation_size(s.indexrelid) <span class="hljs-keyword">AS</span> bytes
  <span class="hljs-keyword">FROM</span> pg_stat_user_indexes s
  <span class="hljs-keyword">JOIN</span> pg_index i <span class="hljs-keyword">USING</span> (indexrelid)
<span class="hljs-keyword">WHERE</span> s.idx_scan <span class="hljs-operator">=</span> <span class="hljs-number">0</span>
  <span class="hljs-keyword">AND</span> <span class="hljs-keyword">NOT</span> i.indisunique
  <span class="hljs-keyword">AND</span> <span class="hljs-keyword">NOT</span> i.indisprimary
<span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> pg_relation_size(s.indexrelid) <span class="hljs-keyword">DESC</span>;
</code></pre>
<br />
<ul>
<li><code>idx_scan</code> = 0 with <code>bytes</code> over 100 MB: a write tax on every INSERT and non-HOT UPDATE</li>
<li>Zero counts only since <code>stats_reset</code> in <code>pg_stat_database</code>; a short window is not proof</li>
<li>Each replica counts its own scans; check every node before dropping</li>
</ul>
<footer>Scott Mead · <a href="mailto:scott@meads.us">scott@meads.us</a> · NYC Postgres Meetup · 2026 · Creative Commons Attribution License</footer>
</section>

<h1 id="the-index-that-turns-off-hot">The index that turns off HOT</h1>
<p>HOT: Only update the HEAP (Heap Only Tuples) if the new version fits on the same page and no indexed column change</p>
<br />
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">UPDATE</span> pgbench_accounts <span class="hljs-keyword">SET</span> abalance <span class="hljs-operator">=</span> abalance <span class="hljs-operator">+</span> <span class="hljs-number">1</span> <span class="hljs-keyword">WHERE</span> aid <span class="hljs-operator">=</span> $<span class="hljs-number">1</span>;
<span class="hljs-keyword">CREATE</span> INDEX <span class="hljs-keyword">ON</span> pgbench_accounts (abalance);                          <span class="hljs-comment">-- second run only</span>
</code></pre>
<br />
<table>
<thead>
<tr>
<th></th>
<th>no index on <code>abalance</code></th>
<th>one index on <code>abalance</code></th>
</tr>
</thead>
<tbody>
<tr>
<td>update</td>
<td>HOT update</td>
<td>every update changes <code>abalance</code> → no HOT</td>
</tr>
<tr>
<td>indexes</td>
<td>no index touched; old version pruned in place on the next visit</td>
<td>an index entry every time</td>
</tr>
<tr>
<td>dead tuples</td>
<td>stay flat, even with autovacuum off</td>
<td>every update leaves a dead tuple behind</td>
</tr>
</tbody>
</table>
<footer>Scott Mead · <a href="mailto:scott@meads.us">scott@meads.us</a> · NYC Postgres Meetup · 2026 · Creative Commons Attribution License</footer>
</section>

<h1 id="watch-the-hot-ratio-then-drop-the-index">Watch the HOT ratio, then drop the index</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> relname, n_tup_upd, n_tup_hot_upd, n_tup_newpage_upd,   <span class="hljs-comment">-- n_tup_newpage_upd: PG 16+</span>
       n_dead_tup
  <span class="hljs-keyword">FROM</span> pg_stat_user_tables
<span class="hljs-keyword">WHERE</span> n_tup_upd <span class="hljs-operator">&gt;</span> <span class="hljs-number">0</span>
<span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> n_tup_upd <span class="hljs-keyword">DESC</span>;
</code></pre>
<br />
<ul>
<li><code>n_tup_hot_upd</code> under half of <code>n_tup_upd</code>: an indexed column is updated, or the page is full</li>
<li>Counters are cumulative; diff two samples</li>
<li>Save <code>pg_get_indexdef()</code> first, then <code>DROP INDEX CONCURRENTLY</code></li>
</ul>
<br />
<table>
<thead>
<tr>
<th></th>
<th></th>
<th></th>
</tr>
</thead>
<tbody>
<tr>
<td>alerting today</td>
<td>unused index bytes (daily); invalid indexes (hourly)</td>
<td>yes</td>
</tr>
<tr>
<td></td>
<td>HOT ratio</td>
<td>no</td>
</tr>
<tr>
<td>verify</td>
<td><code>hot_pct</code> recovers on the next sample; the index is gone from <code>pg_index</code></td>
<td></td>
</tr>
</tbody>
</table>

</section>

<h1 id="its-always-connections-3">It's always connections!</h1>
<p>Actually - it's efficiency</p>
<p>Thirty years of the same response, raise <code>max_connections</code>.</p>
<ul>
<li>Just raising your connections glosses over the problem.</li>
<li>Make every interaction with the database direct, fast and with consistent latency</li>
<li>Your <em>app</em> depends on external services. Don't force your DB to as well.</li>
</ul>
<br />
<table>
<thead>
<tr>
<th>Mistake</th>
<th>What it does to connections</th>
<th>The efficiency fix</th>
</tr>
</thead>
<tbody>
<tr>
<td>connection storms</td>
<td>one per request, the CPU forks</td>
<td>Properly Sized pool</td>
</tr>
<tr>
<td>ignoring MVCC</td>
<td>every reader steps over the dead versions</td>
<td>a key that only grows gets its own table</td>
</tr>
<tr>
<td>long-running transactions</td>
<td>held for the whole wait</td>
<td>only SQL inside the transaction</td>
</tr>
<tr>
<td>bulk DELETE</td>
<td>one held for hours, every query slower</td>
<td>partition and <code>DROP</code></td>
</tr>
<tr>
<td>unused indexes</td>
<td>every write holds longer, the pool grows</td>
<td>no index without a <code>SELECT</code></td>
</tr>
</tbody>
</table>
<p><small>Make each transaction cheaper and the connection count follows</small></p>
<footer>Scott Mead · <a href="mailto:scott@meads.us">scott@meads.us</a> · NYC Postgres Meetup · 2026 · Creative Commons Attribution License</footer>
</section>

<h1 id="what-vacuum-tells-you-1">What vacuum tells you</h1>
<pre><code class="language-text">INFO:  finished vacuuming "app.public.orders": index scans: 0
tuples: 0 removed, 1483112 remain, <b>612004 are dead but not yet removable</b>
removable cutoff: 982144, which was 61930 XIDs old when operation ended</code></pre>
<p>&quot;dead but not yet removable&quot; with an old cutoff: someone holds the horizon.</p>
<table>
<thead>
<tr>
<th>Holder</th>
<th>What it pins</th>
<th>Where to look</th>
</tr>
</thead>
<tbody>
<tr>
<td>Report running 40 minutes *</td>
<td>snapshot (<code>xmin</code>)</td>
<td><code>pg_stat_activity</code></td>
</tr>
<tr>
<td>Nightly batch in one transaction</td>
<td>xid and snapshot</td>
<td><code>pg_stat_activity</code></td>
</tr>
<tr>
<td><code>pg_dump</code> at noon</td>
<td>snapshot</td>
<td><code>pg_stat_activity</code></td>
</tr>
<tr>
<td>Physical slot with <code>hot_standby_feedback</code></td>
<td><code>xmin</code> for every table</td>
<td><code>pg_replication_slots</code></td>
</tr>
<tr>
<td>Logical slot nobody consumes</td>
<td><code>catalog_xmin</code>; WAL is retained</td>
<td><code>pg_replication_slots</code></td>
</tr>
<tr>
<td>Prepared transaction nobody finished</td>
<td><code>xmin</code>, indefinitely</td>
<td><code>pg_prepared_xacts</code></td>
</tr>
</tbody>
</table>
<p><small>* A read-only transaction holds one too.</small></p>

<h1 id="appendix-know-your-defaults">Appendix: know your defaults</h1>
<p>You see nothing, until one query holds a connection for hours.</p>
<ul>
<li><code>statement_timeout</code></li>
<li><code>lock_timeout</code></li>
<li><code>idle_in_transaction_session_timeout</code></li>
<li><code>transaction_timeout</code> (PG 17)</li>
<li><code>idle_session_timeout</code> (PG 14)</li>
</ul>
<p>All five default to 0: a connection can be held forever.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">ALTER</span> ROLE reporting  <span class="hljs-keyword">SET</span> statement_timeout <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;15min&#x27;</span>;
<span class="hljs-keyword">SELECT</span> rolname                                             <span class="hljs-comment">-- login roles with no statement_timeout override</span>
  <span class="hljs-keyword">FROM</span> pg_roles r
<span class="hljs-keyword">WHERE</span> rolcanlogin
  <span class="hljs-keyword">AND</span> <span class="hljs-keyword">NOT</span> <span class="hljs-keyword">EXISTS</span> (<span class="hljs-keyword">SELECT</span> <span class="hljs-number">1</span> <span class="hljs-keyword">FROM</span> pg_db_role_setting s
                  <span class="hljs-keyword">WHERE</span> s.setrole <span class="hljs-operator">=</span> r.oid <span class="hljs-keyword">AND</span> s.setconfig::text <span class="hljs-keyword">LIKE</span> <span class="hljs-string">&#x27;%statement_timeout%&#x27;</span>);
</code></pre>
