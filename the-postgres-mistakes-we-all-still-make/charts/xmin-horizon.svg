<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" font-family="DejaVu Sans, system-ui, sans-serif">
  <rect width="1100" height="620" fill="#1a1a19"/>
  <text x="40" y="44" fill="#f0efec" font-size="24">One open transaction pins the xmin horizon for every table in the database</text>

  <!-- the idle session -->
  <rect x="330" y="80" width="710" height="44" rx="6" fill="#d95926" fill-opacity="0.18" stroke="#d95926" stroke-width="2"/>
  <text x="340" y="109" fill="#f0efec" font-size="18">BEGIN; UPDATE ...</text>
  <text x="685" y="109" fill="#f0efec" font-size="18" text-anchor="middle">idle in transaction for 5 minutes</text>
  <text x="1030" y="109" fill="#f0efec" font-size="18" text-anchor="end" font-weight="bold">COMMIT</text>

  <!-- horizon line -->
  <line x1="330" y1="124" x2="330" y2="134" stroke="#d95926" stroke-width="3"/>
  <line x1="330" y1="158" x2="330" y2="470" stroke="#d95926" stroke-width="3"/>
  <text x="330" y="194" fill="#f0efec" font-size="18" text-anchor="middle" dy="0">xmin horizon = 1000</text>
  <!-- at COMMIT the horizon is released -->
  <line x1="1040" y1="124" x2="1040" y2="470" stroke="#199e70" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="1032" y="186" fill="#199e70" font-size="16" text-anchor="end">COMMIT releases the horizon</text>

  <!-- shaded: not removable -->
  <rect x="332" y="206" width="708" height="264" fill="#d95926" fill-opacity="0.07"/>
  <text x="690" y="232" fill="#c3c2b7" font-size="18" text-anchor="middle">died after xid 1000: dead but not removable</text>
