<text x="238" y="96" fill="#898781" font-size="12.5" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, monospace">{"name": "Jane Smith", ...}</text>
<text x="524" y="96" fill="#898781" font-size="13" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, monospace">110</text>
<text x="614" y="96" fill="#898781" font-size="11.5" text-anchor="start">dead until VACUUM</text>
