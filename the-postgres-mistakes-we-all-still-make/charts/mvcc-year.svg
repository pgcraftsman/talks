<text x="120" y="130" fill="#898781" font-size="13" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, monospace">610</text>
<text x="196" y="130" fill="#898781" font-size="13" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, monospace">1</text>
<text x="238" y="130" fill="#898781" font-size="12.5" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, monospace">{..., "login_history": [1 login]}</text>
<text x="524" y="130" fill="#898781" font-size="13" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, monospace">592</text>
<text x="614" y="130" fill="#898781" font-size="11.5" text-anchor="start">dead until VACUUM</text>
<line x1="189" y1="125" x2="584" y2="125" stroke="#e5484d" stroke-width="1.4"/>
<rect x="32" y="144" width="684" height="28" rx="4" fill="#f0efec" fill-opacity="0.04" stroke="#f0efec" stroke-width="0"/>
<text x="42" y="164" fill="#898781" font-size="13" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, monospace">610</text>
<text x="120" y="164" fill="#898781" font-size="13" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, monospace">731</text>
<text x="196" y="164" fill="#898781" font-size="13" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, monospace">1</text>
<text x="238" y="164" fill="#898781" font-size="12.5" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, monospace">{..., "login_history": [2 logins]}</text>
<text x="524" y="164" fill="#898781" font-size="13" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, monospace">616</text>
<text x="614" y="164" fill="#898781" font-size="11.5" text-anchor="start">dead until VACUUM</text>
<line x1="189" y1="159" x2="584" y2="159" stroke="#e5484d" stroke-width="1.4"/>
<rect x="32" y="178" width="684" height="28" rx="4" fill="#f0efec" fill-opacity="0.04" stroke="#f0efec" stroke-width="0"/>
<text x="42" y="198" fill="#898781" font-size="13" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, monospace">731</text>
<text x="120" y="198" fill="#898781" font-size="13" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, monospace">858</text>
<text x="196" y="198" fill="#898781" font-size="13" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, monospace">1</text>
<text x="238" y="198" fill="#898781" font-size="12.5" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, monospace">{..., "login_history": [3 logins]}</text>
<text x="524" y="198" fill="#898781" font-size="13" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, monospace">640</text>
<text x="614" y="198" fill="#898781" font-size="11.5" text-anchor="start">dead until VACUUM</text>
<line x1="189" y1="193" x2="584" y2="193" stroke="#e5484d" stroke-width="1.4"/>
<rect x="32" y="212" width="684" height="28" rx="4" fill="#f0efec" fill-opacity="0.04" stroke="#f0efec" stroke-width="0"/>
<text x="42" y="232" fill="#898781" font-size="12" text-anchor="start">361 more versions, each 24 bytes bigger than the last</text>
<rect x="32" y="246" width="684" height="28" rx="4" fill="#f0efec" fill-opacity="0.04" stroke="#f0efec" stroke-width="0"/>
<text x="42" y="266" fill="#f0efec" font-size="13" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, monospace">46,210</text>
<text x="120" y="266" fill="#f0efec" font-size="13" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, monospace"></text>
<text x="196" y="266" fill="#f0efec" font-size="13" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, monospace">1</text>
<text x="238" y="266" fill="#f0efec" font-size="12.5" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, monospace">{..., "login_history": [365 logins]}</text>
<text x="524" y="266" fill="#f0efec" font-size="13" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, monospace">9,328</text>
<text x="614" y="266" fill="#199e70" font-size="11.5" text-anchor="start">live</text>
<text x="38" y="296" fill="#898781" font-size="12.5" text-anchor="start">one live row, 364 dead versions, 1.8 MB. A reader of this row steps over all of it</text>
<rect x="24" y="322" width="700" height="86" rx="8" fill="#3987e5" fill-opacity="0.07" stroke="#3987e5" stroke-width="1.5"/>
<text x="38" y="344" fill="#f0efec" font-size="13" text-anchor="start">with autovacuum keeping up, the free space map after each UPDATE</text>
<text x="38" y="366" fill="#c3c2b7" font-size="12" text-anchor="start">version 2 freed 592 bytes. Version 3 needs 616. It does not fit, and neither does any version after it</text>
<text x="38" y="386" fill="#3987e5" font-size="12" text-anchor="start">a document that only grows never fits the space its last version freed</text>
<text x="754" y="34" fill="#c3c2b7" font-size="13" text-anchor="start">arithmetic from the measured sizes</text>
<text x="754" y="60" fill="#898781" font-size="12.5" text-anchor="start">one user, one year</text>
<text x="754" y="78" fill="#f0efec" font-size="14" text-anchor="start">1.8 MB, 221 pages</text>
<text x="754" y="102" fill="#898781" font-size="12.5" text-anchor="start">one million users</text>
<text x="754" y="120" fill="#f0efec" font-size="14" text-anchor="start">1.8 TB of versions</text>
<text x="754" y="144" fill="#898781" font-size="12.5" text-anchor="start">live data in it</text>
<text x="754" y="162" fill="#f0efec" font-size="14" text-anchor="start">9.3 GB</text>
<text x="754" y="186" fill="#898781" font-size="12.5" text-anchor="start">bloat, dead versions</text>
<text x="754" y="204" fill="#e5484d" font-size="14" text-anchor="start">1.80 TB (1,801,072 bytes per user)</text>
<text x="754" y="234" fill="#898781" font-size="12.5" text-anchor="start">the fix</text>
<text x="754" y="254" fill="#199e70" font-size="14" text-anchor="start">login_history is a table,</text>
<text x="754" y="273" fill="#199e70" font-size="14" text-anchor="start">not a key in the document.</text>
<text x="754" y="292" fill="#199e70" font-size="14" text-anchor="start">INSERT 24 bytes, UPDATE nothing</text>
</svg>
