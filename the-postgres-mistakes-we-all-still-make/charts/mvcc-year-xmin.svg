<rect x="32" y="158" width="684" height="28" rx="4" fill="#f0efec" fill-opacity="0.04" stroke="#f0efec" stroke-width="0"/>
<text x="42" y="178" fill="#898781" font-size="12" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, monospace">1,000,517</text>
<text x="120" y="178" fill="#898781" font-size="12" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, monospace">2,000,533</text>
<text x="212" y="178" fill="#898781" font-size="13" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, monospace">1</text>
<text x="254" y="178" fill="#898781" font-size="12.5" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, monospace">{..., "last_login": "Sat 01:00"}</text>
<text x="540" y="178" fill="#898781" font-size="13" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, monospace">110</text>
<text x="570" y="178" fill="#898781" font-size="10.5" text-anchor="start">dead, cannot be vacuumed</text>
<line x1="205" y1="173" x2="564" y2="173" stroke="#e5484d" stroke-width="1.4"/>
<rect x="32" y="192" width="684" height="28" rx="4" fill="#f0efec" fill-opacity="0.04" stroke="#f0efec" stroke-width="0"/>
<text x="42" y="212" fill="#898781" font-size="12" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, monospace">2,000,533</text>
<text x="120" y="212" fill="#898781" font-size="12" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, monospace">3,000,548</text>
<text x="212" y="212" fill="#898781" font-size="13" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, monospace">1</text>
<text x="254" y="212" fill="#898781" font-size="12.5" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, monospace">{..., "last_login": "Sat 02:00"}</text>
<text x="540" y="212" fill="#898781" font-size="13" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, monospace">110</text>
<text x="570" y="212" fill="#898781" font-size="10.5" text-anchor="start">dead, cannot be vacuumed</text>
<line x1="205" y1="207" x2="564" y2="207" stroke="#e5484d" stroke-width="1.4"/>
<rect x="32" y="226" width="684" height="28" rx="4" fill="#f0efec" fill-opacity="0.04" stroke="#f0efec" stroke-width="0"/>
<text x="42" y="246" fill="#898781" font-size="12" text-anchor="start">44 more versions, 110 bytes each, a million xids apart</text>
<rect x="32" y="260" width="684" height="28" rx="4" fill="#f0efec" fill-opacity="0.04" stroke="#f0efec" stroke-width="0"/>
<text x="42" y="280" fill="#f0efec" font-size="12" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, monospace">48,000,611</text>
<text x="120" y="280" fill="#f0efec" font-size="12" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, monospace"></text>
<text x="212" y="280" fill="#f0efec" font-size="13" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, monospace">1</text>
<text x="254" y="280" fill="#f0efec" font-size="12.5" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, monospace">{..., "last_login": "Sun 23:00"}</text>
<text x="540" y="280" fill="#f0efec" font-size="13" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, monospace">110</text>
<text x="570" y="280" fill="#199e70" font-size="10.5" text-anchor="start">live</text>
<text x="38" y="310" fill="#898781" font-size="12.5" text-anchor="start">one live row, 48 dead versions, 5.4 KB. A reader of this row steps over all of it</text>
<rect x="24" y="336" width="700" height="86" rx="8" fill="#3987e5" fill-opacity="0.07" stroke="#3987e5" stroke-width="1.5"/>
<text x="38" y="358" fill="#f0efec" font-size="13" text-anchor="start">the free space map never gets an entry</text>
<text x="38" y="380" fill="#c3c2b7" font-size="12" text-anchor="start">autovacuum ran all weekend. Cutoff 501 every time, 48 million commits behind, nothing removed</text>
<text x="38" y="400" fill="#3987e5" font-size="12" text-anchor="start">with vacuum unable to progress past an old xid, these rows have no chance of being reused</text>
<text x="754" y="34" fill="#c3c2b7" font-size="13" text-anchor="start">arithmetic from the measured sizes</text>
<text x="754" y="60" fill="#898781" font-size="12.5" text-anchor="start">one user, one weekend</text>
<text x="754" y="78" fill="#f0efec" font-size="14" text-anchor="start">5.4 KB, 1 page</text>
<text x="754" y="102" fill="#898781" font-size="12.5" text-anchor="start">one million users</text>
<text x="754" y="120" fill="#f0efec" font-size="14" text-anchor="start">5.4 GB of versions</text>
<text x="754" y="144" fill="#898781" font-size="12.5" text-anchor="start">live data in it</text>
<text x="754" y="162" fill="#f0efec" font-size="14" text-anchor="start">110 MB</text>
<text x="754" y="186" fill="#898781" font-size="12.5" text-anchor="start">bloat, dead versions</text>
<text x="754" y="204" fill="#e5484d" font-size="14" text-anchor="start">5.3 GB (5,280 bytes per user)</text>
<text x="754" y="234" fill="#898781" font-size="12.5" text-anchor="start">the fix</text>
<text x="754" y="254" fill="#199e70" font-size="14" text-anchor="start">COMMIT or kill the stuck session.</text>
<text x="754" y="273" fill="#199e70" font-size="14" text-anchor="start">The next vacuum pass removes</text>
<text x="754" y="292" fill="#199e70" font-size="14" text-anchor="start">48 million versions</text>
</svg>
