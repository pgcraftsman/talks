<line x1="34" y1="109" x2="714" y2="109" stroke="#e5484d" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="254" y="120" fill="#e5484d" font-size="11" text-anchor="start">xmin horizon = 501, one checkout stuck on the gateway for 48 hours, since Fri 23:00</text>
<rect x="32" y="124" width="684" height="28" rx="4" fill="#f0efec" fill-opacity="0.04" stroke="#f0efec" stroke-width="0"/>
<text x="42" y="144" fill="#898781" font-size="12" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, monospace">502</text>
<text x="120" y="144" fill="#898781" font-size="12" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, monospace">1,000,517</text>
<text x="212" y="144" fill="#898781" font-size="13" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, monospace">1</text>
<text x="254" y="144" fill="#898781" font-size="12.5" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, monospace">{..., "last_login": "Sat 00:00"}</text>
<text x="540" y="144" fill="#898781" font-size="13" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, monospace">110</text>
<text x="570" y="144" fill="#898781" font-size="10.5" text-anchor="start">dead, cannot be vacuumed</text>
