[databases]
storm = host=/tmp port=1710 dbname=storm

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
auth_type = trust
auth_file = /tmp/pgday-storm/userlist.txt
pool_mode = transaction
default_pool_size = 20
max_client_conn = 2000
server_idle_timeout = 60
logfile = /tmp/pgday-storm/pgbouncer.log
pidfile = /tmp/pgday-storm/pgbouncer.pid
admin_users = scott.mead
unix_socket_dir = /tmp/pgday-storm
